<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000">
  <defs>
    <linearGradient id="cyanMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5ffff"/><stop offset=".18" stop-color="#58f3ff"/><stop offset=".45" stop-color="#077f9c"/><stop offset=".62" stop-color="#dfffff"/><stop offset=".82" stop-color="#19cde6"/><stop offset="1" stop-color="#053d52"/>
    </linearGradient>
    <linearGradient id="pinkMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd4e3"/><stop offset=".22" stop-color="#ff4d89"/><stop offset=".55" stop-color="#8f163d"/><stop offset=".76" stop-color="#ffb2cc"/><stop offset="1" stop-color="#ff3c5f"/>
    </linearGradient>
    <linearGradient id="cyanPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/><stop offset=".48" stop-color="#73f4ff"/><stop offset="1" stop-color="#ff3c5f"/>
    </linearGradient>
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.5" fill="#fff" opacity=".23"/>
    </pattern>
    <pattern id="halftonePink" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#ff3c5f" opacity=".32"/>
    </pattern>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="1400" height="1000" fill="none"/>

  <!-- poster-style dark horizon -->
  <path d="M0 744C130 704 246 720 351 751c126 38 241 22 347-35 114-61 248-60 362-19 119 42 223 57 340 24v279H0z" fill="#05070b" opacity=".73"/>
  <path d="M0 610l1400-92v482H0z" fill="url(#halftone)" opacity=".44"/>

  <!-- large concentric circle cluster -->
  <g transform="translate(1080 184)" filter="url(#rough)">
    <circle r="170" fill="none" stroke="#fff" stroke-width="20" opacity=".92"/>
    <circle r="132" fill="none" stroke="#ff3c5f" stroke-width="17" opacity=".94"/>
    <circle r="96" fill="none" stroke="#0b0d12" stroke-width="18"/>
    <circle r="62" fill="none" stroke="#fff" stroke-width="15"/>
    <circle r="30" fill="#0b0d12"/>
    <circle cx="-174" cy="-76" r="57" fill="none" stroke="#fff" stroke-width="12"/>
    <circle cx="-230" cy="-39" r="35" fill="none" stroke="#ff3c5f" stroke-width="9"/>
    <circle cx="-279" cy="-6" r="23" fill="none" stroke="#0b0d12" stroke-width="8"/>
  </g>

  <!-- stars and drips -->
  <g transform="translate(805 315)" filter="url(#rough)">
    <polygon points="0,-80 25,-27 84,-21 40,18 52,77 0,48 -52,77 -40,18 -84,-21 -25,-27" fill="#07090d" stroke="#fff" stroke-width="9"/>
    <polygon points="126,-32 143,3 182,8 153,34 161,73 126,54 91,73 99,34 70,8 109,3" fill="#07090d" stroke="#ff3c5f" stroke-width="7"/>
    <polygon points="-128,-17 -116,8 -88,12 -109,31 -103,59 -128,45 -153,59 -147,31 -168,12 -140,8" fill="#fff" stroke="#0a0b0f" stroke-width="6"/>
    <path d="M-7 48v85M29 58v55M132 53v67" stroke="#07090d" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- rough curling flourish -->
  <g fill="none" stroke-linecap="round" filter="url(#rough)">
    <path d="M70 382C170 244 293 217 378 286c54 43 24 104-31 91-48-11-38-68 1-78 67-18 129 62 169 119 47 67 107 75 177 32" stroke="#0a0b0f" stroke-width="14"/>
    <path d="M68 357C171 220 282 197 361 252" stroke="#fff" stroke-width="6" opacity=".82"/>
    <path d="M63 425C149 341 218 356 255 411 287 459 244 498 205 473c-32-20-17-61 17-64" stroke="#ff3c5f" stroke-width="10" opacity=".8"/>
    <path d="M371 293c73-82 131-99 179-63 45 34 18 82-21 70-29-9-30-44-2-59" stroke="#00e5ff" stroke-width="9" opacity=".85"/>
  </g>

  <!-- chrome/turquoise ring pile inspired by 2000s vector posters -->
  <g transform="translate(965 760)" filter="url(#rough)">
    <circle cx="0" cy="0" r="102" fill="none" stroke="url(#cyanMetal)" stroke-width="31"/>
    <circle cx="0" cy="0" r="61" fill="none" stroke="#d9ffff" stroke-width="7" opacity=".75"/>
    <circle cx="143" cy="30" r="76" fill="none" stroke="url(#cyanMetal)" stroke-width="24"/>
    <circle cx="143" cy="30" r="38" fill="#0c2732" opacity=".62"/>
    <circle cx="-118" cy="68" r="61" fill="none" stroke="url(#pinkMetal)" stroke-width="22"/>
    <circle cx="-118" cy="68" r="29" fill="#fff" opacity=".7"/>
    <circle cx="84" cy="-121" r="49" fill="none" stroke="url(#cyanMetal)" stroke-width="18"/>
    <circle cx="-79" cy="-105" r="35" fill="none" stroke="#fff" stroke-width="11" opacity=".82"/>
  </g>

  <!-- hard vector swooshes -->
  <g fill="none" stroke-linecap="round" filter="url(#rough)">
    <path d="M335 826c127-157 255-203 402-145 73 29 123 40 185 26" stroke="#fff" stroke-width="10" opacity=".82"/>
    <path d="M351 854c112-113 230-150 355-113" stroke="#00e5ff" stroke-width="15" opacity=".75"/>
    <path d="M355 894c111-88 212-110 304-82" stroke="#ff3c5f" stroke-width="11" opacity=".72"/>
  </g>

  <!-- halftone / stripe fragments -->
  <rect x="96" y="657" width="260" height="132" fill="url(#halftonePink)" opacity=".45" transform="rotate(-8 96 657)"/>
  <g transform="translate(1210 518) rotate(-16)" opacity=".72">
    <rect width="152" height="18" fill="#00e5ff"/><rect y="33" width="213" height="18" fill="#fff"/><rect y="66" width="174" height="18" fill="#39ff14"/>
  </g>

  <!-- little sparkles -->
  <g fill="#fff" opacity=".82">
    <path d="M603 183l10 23 23 10-23 10-10 23-10-23-23-10 23-10z"/>
    <path d="M1190 424l7 16 16 7-16 7-7 16-7-16-16-7 16-7z"/>
    <path d="M480 570l6 14 14 6-14 6-6 14-6-14-14-6 14-6z"/>
  </g>
</svg>