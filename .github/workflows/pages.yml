name: Deploy Wa to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Enable LG modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected performance patch target missing in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Cards decorators only need to observe Cards. Keeping these observers on
          # documentElement made every RBX presence DOM change wake three unrelated
          # Cards passes, which is especially expensive on low-end phones.
          replace_once(
              'site/cards-polish.js',
              "function boot(){injectStyles();new MutationObserver(patch).observe(document.documentElement,{childList:true,subtree:true});patch();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')patch()})}",
              "function boot(){injectStyles();const lgObs=new MutationObserver(patch),lgRoot=document.getElementById('page-cards')||document.body;lgObs.observe(lgRoot,{childList:true,subtree:true});patch();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')patch()})}"
          )
          replace_once(
              'site/dev-cards.js',
              "function boot(){injectStyles();const obs=new MutationObserver(schedulePatch);obs.observe(document.documentElement,{childList:true,subtree:true});sync();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});setInterval(()=>{if(document.visibilityState==='visible'&&$('#page-cards')?.classList.contains('active'))sync()},30000)}",
              "function boot(){injectStyles();const obs=new MutationObserver(schedulePatch),root=$('#page-cards')||document.body;obs.observe(root,{childList:true,subtree:true});sync();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});setInterval(()=>{if(document.visibilityState==='visible'&&$('#page-cards')?.classList.contains('active'))sync()},30000)}"
          )
          replace_once(
              'site/custom-card-tiers.js',
              "function boot(){css();const ob=new MutationObserver(()=>{clearTimeout(S.t);S.t=setTimeout(patch,35)});ob.observe(document.documentElement,{childList:true,subtree:true});sync();document.addEventListener('visibilitychange',()=>document.visibilityState==='visible'&&sync());setInterval(()=>document.visibilityState==='visible'&&$('#page-cards')?.classList.contains('active')&&sync(),30000)}",
              "function boot(){css();const ob=new MutationObserver(()=>{clearTimeout(S.t);S.t=setTimeout(patch,35)}),root=$('#page-cards');if(root)ob.observe(root,{childList:true,subtree:true});ob.observe(document.body,{childList:true,subtree:false});sync();document.addEventListener('visibilitychange',()=>document.visibilityState==='visible'&&sync());setInterval(()=>document.visibilityState==='visible'&&$('#page-cards')?.classList.contains('active')&&sync(),30000)}"
          )

          # Keep every visible tier description aligned with the server matrix.
          old_tiers = '<option value="PK_">PK_ — Full access</option><option value="UPK_">UPK_ — Leaderboard + User Adding</option><option value="BK_">BK_ — Monitor + User Adding</option>'
          new_tiers = '<option value="PK_">PK_ — Deluxe / all features except Key Generator</option><option value="UPK_">UPK_ — Monitor + Leaderboard + User Adding + Cards + History</option><option value="BK_">BK_ — Monitor + Leaderboard + User Adding + Cards</option>'
          replace_once('site/index.html', old_tiers, new_tiers)
          replace_once('site/ck-key-manager.js', old_tiers + '<option value="CK_">CK_ — Configurable feature access</option>', new_tiers + '<option value="CK_">CK_ — Configurable feature access</option>')
          replace_once(
              'site/index.html',
              'The backend picks up new/removed users within one poll cycle (~10s).',
              'The backend picks up new/removed users on the static RBX poll cycle (about 2 minutes).'
          )

          p = Path('site/index.html')
          s = p.read_text(encoding='utf-8')
          # Preserve the base page's saved-key snapshot, but load the standard-key
          # owner before auth-ck.js. standard-key-login clears saved standard inputs
          # immediately, so auth-ck's private setTimeout(0) bootstrap cannot win while
          # the parser waits on later external scripts.
          old = "if(SITE_KEY)login(SITE_KEY).catch(()=>logout());"
          if old not in s:
              raise SystemExit('Expected saved-key bootstrap target missing in site/index.html')
          s = s.replace(old, "window.LG_LEGACY_SITE_KEY=SITE_KEY;", 1)
          tags = [
              '<script src="fetch-bootstrap.js"></script>',
              '<script src="standard-key-login.js?v=20260916-3"></script>',
              '<script src="auth-ck.js"></script>',
              '<script src="login-resilience.js?v=20260916-4"></script>',
              '<script src="ck-key-manager.js?v=20260916-3"></script>',
              '<script src="key-delete-runtime.js?v=20260916-4"></script>',
              '<script src="egress-runtime.js?v=20260916-4"></script>',
              '<script src="exchange.js"></script>',
              '<script src="cards.js"></script>',
              '<script src="profile-verify.js"></script>',
              '<script src="profile-verify-bootstrap.js"></script>',
              '<script src="cards-polish.js"></script>',
              '<script src="dev-cards.js"></script>',
              '<script src="custom-card-tiers.js"></script>',
              '<script src="mc-detector.js"></script>',
              '<script src="mc-detector-session.js"></script>',
              '<script src="mc-player-lists.js"></script>',
              '<script src="mc-aero-final.js"></script>',
              '<script src="mc-frutiger-aero-overhaul.js"></script>',
              '<script src="rbx-metro.js"></script>',
              '<script src="performance-runtime.js"></script>',
              '<script src="rbx-data-performance.js"></script>',
              '<script src="ck-feature-guard.js?v=20260904-1"></script>',
          ]
          for tag in tags:
              if tag not in s:
                  s = s.replace('</body>', tag + '\n</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate optimized frontend
        shell: bash
        run: |
          set -euo pipefail
          find site -maxdepth 1 -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          grep -q 'fetch-bootstrap.js' site/index.html
          grep -q 'standard-key-login.js?v=20260916-3' site/index.html
          grep -q 'auth-ck.js' site/index.html
          grep -q 'login-resilience.js?v=20260916-4' site/index.html
          grep -q 'ck-key-manager.js?v=20260916-3' site/index.html
          grep -q 'key-delete-runtime.js?v=20260916-4' site/index.html
          grep -q 'egress-runtime.js?v=20260916-4' site/index.html
          python - <<'PY'
          from pathlib import Path
          s = Path('site/index.html').read_text(encoding='utf-8')
          standard = s.index('standard-key-login.js?v=20260916-3')
          auth_ck = s.index('auth-ck.js')
          if standard >= auth_ck:
              raise SystemExit('standard-key-login.js must load before auth-ck.js')
          PY
          grep -q 'legacyTierFromRaw' site/egress-runtime.js
          grep -q "UPK_: \['monitor','leaderboard','history','adduser'\]" site/egress-runtime.js
          grep -q 'UPK_.*cards:true' site/egress-runtime.js
          grep -q "UPK_: {tabs:\['monitor','leaderboard','history','adduser'\]" site/standard-key-login.js
          grep -q '6500' site/standard-key-login.js
          grep -q 'stopImmediatePropagation' site/standard-key-login.js
          grep -q 'Guard saved standard keys before auth-ck' site/standard-key-login.js
          grep -q 'persistWhenScriptsReady' site/standard-key-login.js
          grep -q 'Do not block the login promise on secondary data' site/standard-key-login.js
          grep -q 'must never enter completeLogin' site/auth-ck.js
          grep -q 'LGStandardKeyLogin.standardLogin' site/auth-ck.js
          grep -q 'Monitor + Leaderboard + User Adding + Cards + History' site/index.html
          grep -q 'static RBX poll cycle (about 2 minutes)' site/index.html
          grep -q 'rbx-data-performance.js' site/index.html
          grep -q 'ck-feature-guard.js' site/index.html
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4