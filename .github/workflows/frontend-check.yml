name: Frontend checks

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find site -maxdepth 1 -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
      - name: Check auth and key-management contracts
        shell: bash
        run: |
          set -euo pipefail
          test -s site/login-resilience.js
          grep -q "tracked-user hydration" site/login-resilience.js
          grep -q "saved-key recovery" site/login-resilience.js
          grep -q "withTimeout" site/login-resilience.js
          grep -q "Signing in" site/login-resilience.js

          test -s site/egress-runtime.js
          grep -q "legacyTierFromRaw" site/egress-runtime.js
          grep -q "directLegacyAccount" site/egress-runtime.js
          grep -q "Login timed out" site/egress-runtime.js
          grep -q "UPK_: \['monitor','leaderboard','history','adduser'\]" site/egress-runtime.js
          grep -q "BK_:  \['monitor','leaderboard','adduser'\]" site/egress-runtime.js
          grep -q "UPK_.*monitor:true.*leaderboard:true.*history:true.*adduser:true.*cards:true" site/egress-runtime.js
          grep -q "BK_.*monitor:true.*leaderboard:true.*adduser:true.*cards:true" site/egress-runtime.js

          test -s site/standard-key-login.js
          grep -q "lg-api" site/standard-key-login.js
          grep -q "UPK_: {tabs:\['monitor','leaderboard','history','adduser'\]" site/standard-key-login.js
          grep -q "6500" site/standard-key-login.js
          grep -q "Commit authenticated state immediately" site/standard-key-login.js
          grep -q "stopImmediatePropagation" site/standard-key-login.js
          grep -q "Install synchronously" site/standard-key-login.js
          grep -q "Neutralize auth-ck" site/standard-key-login.js
          grep -q "Do not block the login promise on secondary data" site/standard-key-login.js

          test -s site/ck-key-manager.js
          grep -q "lg-key-admin" site/ck-key-manager.js
          grep -q "data-ckm-feature" site/ck-key-manager.js
          grep -q "Clear all" site/ck-key-manager.js
          grep -q "samePermissions" site/ck-key-manager.js

          test -s site/key-delete-runtime.js
          grep -q "Permanently delete key" site/key-delete-runtime.js
          grep -q "/keys/.*delete" site/key-delete-runtime.js
          grep -q "Permanent Delete backend is not deployed" site/key-delete-runtime.js

          test -s site/ck-feature-guard.js
          grep -q "No Features Enabled" site/ck-feature-guard.js
          grep -q "page-ck-empty" site/ck-feature-guard.js
      - name: Check adaptive performance assets
        shell: bash
        run: |
          test -s site/performance-runtime.js
          test -s site/performance.css