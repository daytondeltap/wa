<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Roblox Presence Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0a0a0f;
    --surface:  #111118;
    --border:   #1e1e2e;
    --accent:   #ff3c5f;
    --accent2:  #00e5ff;
    --green:    #39ff14;
    --muted:    #555570;
    --text:     #e8e8f0;
    --subtext:  #8888aa;
    --font-ui:  'Syne', sans-serif;
    --font-mono:'Space Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  /* scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,.07) 2px,
      rgba(0,0,0,.07) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 2.4rem 2.2rem;
    width: 100%;
    max-width: 360px;
    position: relative;
  }
  .login-card::before {
    content: '';
    position: absolute;
    top: -1px; left: -1px; right: -1px;
    height: 3px;
    border-radius: 10px 10px 0 0;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .logo {
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: .35rem;
  }
  .logo span { color: var(--accent); }

  .login-sub {
    text-align: center;
    font-family: var(--font-mono);
    font-size: .7rem;
    color: var(--subtext);
    letter-spacing: .05em;
    margin-bottom: 1.8rem;
  }

  form { display: flex; flex-direction: column; gap: 1rem; }

  label {
    font-size: .65rem;
    font-weight: 800;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--subtext);
  }

  input[type="password"] {
    font-family: var(--font-mono);
    font-size: .85rem;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: .7rem .8rem;
    outline: none;
    letter-spacing: .04em;
    transition: border-color .2s, box-shadow .2s;
  }
  input[type="password"]:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 0 1px var(--accent2);
  }

  .btn-login {
    font-family: var(--font-mono);
    font-size: .75rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: .65rem;
    cursor: pointer;
    transition: background .2s, color .2s;
    margin-top: .4rem;
  }
  .btn-login:hover { background: var(--accent); color: #fff; }

  .error-msg {
    font-family: var(--font-mono);
    font-size: .7rem;
    color: var(--accent);
    background: rgba(255,60,95,.1);
    border: 1px solid rgba(255,60,95,.3);
    border-radius: 4px;
    padding: .55rem .7rem;
  }

  .login-footer {
    margin-top: 1.6rem;
    text-align: center;
    font-family: var(--font-mono);
    font-size: .62rem;
    color: var(--muted);
    letter-spacing: .05em;
  }
</style>
</head>
<body>

  <div class="login-card">
    <div class="logo">RBX<span>/</span>MONITOR</div>
    <div class="login-sub">RESTRICTED ACCESS — KEY REQUIRED</div>

    {% if error %}
      <div class="error-msg" style="margin-bottom: 1rem;">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="key">Access Key</label>
      <input type="password" id="key" name="key" placeholder="••••••••••••••••••••" autocomplete="off" autofocus required>
      <button type="submit" class="btn-login">Enter</button>
    </form>

    <div class="login-footer">Authorized personnel only</div>
  </div>

</body>
</html>
